<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 تولدت مبارک المیرا 🎂</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100vh;
    font-family: Vazirmatn, Tahoma, sans-serif;
    direction: rtl;
  }
  body {
    background: linear-gradient(-45deg, #0d0221, #1a0b3d, #2d0a4e, #0d0221, #1a0b3d);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
    overflow-x: hidden;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #floaties {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .floaty {
    position: absolute;
    top: 100%;
    animation: floatUp linear infinite;
    opacity: 0.9;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-120vh) rotate(360deg); }
  }
  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }
  .cake {
    font-size: clamp(3em, 10vw, 6em);
    animation: bounceCake 2s ease-in-out infinite;
    filter: drop-shadow(0 0 25px #ff6ec7);
    margin-bottom: 10px;
  }
  @keyframes bounceCake {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
  }
  .title {
    font-size: clamp(1.5em, 5vw, 3em);
    font-weight: 900;
    background: linear-gradient(90deg, #ff6ec7, #ffd93d, #6bcbff, #a0ff6b, #ff6ec7);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255,110,199,0.5));
    margin: 10px 0;
  }
  @keyframes shine {
    to { background-position: 300% center; }
  }
  .name {
    font-size: clamp(1.8em, 6vw, 3.5em);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px #ff6ec7, 0 0 20px #ff6ec7, 0 0 40px #ff3d81, 0 0 80px #ff3d81;
    animation: pulseGlow 1.5s ease-in-out infinite;
    margin: 15px 0;
    padding: 0 10px;
    word-break: break-word;
    max-width: 90vw;
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .message {
    font-size: clamp(1.1em, 3vw, 1.4em);
    color: #a0e7e5;
    max-width: 800px;
    line-height: 1.8;
    min-height: 80px;
    margin: 15px 0;
    text-shadow: 0 0 10px rgba(160,231,229,0.5);
    font-weight: bold;
  }
  .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: #a0e7e5;
    animation: blink 0.8s infinite;
    margin-right: 3px;
    vertical-align: middle;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .wish-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,110,199,0.4);
    border-radius: 20px;
    padding: 15px 25px;
    margin: 15px 0;
    max-width: 700px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(255,110,199,0.2), inset 0 0 20px rgba(255,110,199,0.1);
    font-size: clamp(0.95em, 2.5vw, 1.1em);
    color: #ffd93d;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    line-height: 1.6;
  }
  .buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    padding-bottom: 40px;
  }
  button {
    font-family: inherit;
    font-size: clamp(0.9em, 2.5vw, 1.1em);
    font-weight: 700;
    padding: 12px 28px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
    background: linear-gradient(135deg, #ff6ec7, #ff3d81);
    box-shadow: 0 5px 20px rgba(255,61,129,0.5);
  }
  button:nth-child(2) {
    background: linear-gradient(135deg, #6bcbff, #4a90e2);
    box-shadow: 0 5px 20px rgba(107,203,255,0.5);
  }
  button:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.15); }
  button:active { transform: translateY(-1px) scale(0.98); }
  @media (max-width: 600px) {
    .wish-box { padding: 15px 20px; margin: 15px 0; }
    button { padding: 10px 20px; width: 100%; }
    .buttons { gap: 10px; }
  }
</style>
</head>
<body>

<div id="floaties"></div>

<div class="container">
  <div class="cake">🎂</div>
  
  <h1 class="title">🎉 تولدت مبارک 🎉</h1>
  
  <div class="name">المیرا گوجو بوجووو</div>
  
  <div class="message" id="typed"></div>
  
  <div class="wish-box" id="wish">✨ منتظر یه آرزوی قشنگ باش... ✨</div>
  
  <div class="buttons">
    <button onclick="newWish()">💫 آرزوی جدید</button>
    <button onclick="moreFireworks()">🎆 آتیش‌بازی</button>
  </div>
</div>

<script>
// ============ متن‌های تبریک ============
const MESSAGES = [
  "بە قول خودت بهترین روزتە دیگە پس عالی باششش 🌟✨",
  "سیزده سالگیو بترکونییی 🎂🎉🔥",
  "اون اورئو رو هم میخوری امسال دیگه 🍪😋",
  "بە کصخل بودنت ادامە بده عالیههه 🤪💖",
  "در کل بین سە سال راهنمایی هفتم بهترینشه استفاده کننن ازششش 🏫🚀"
];

// ============ آرزوهای دکمه وسط ============
const WISHES = [
  "خب قبلش چنتا آرزو دارم برات اوکیە؟ 🥰",
  "اول از همه ببخشید نتونستم کار بهتری برات کنم این دیگه بهترین کادویی بود از دستم بر میومدد 🙈",
  "بعد امیدوارم هر روزت بهتر از دیروزت باشه ✨",
  "هرچیزی تو زندگیت میخوای بهش برسییی 🚀",
  "از این خوشگلتر نمیتونی بشی پس آرزو دارم باهوش تر شی یکم 🤓",
  "و البتە این چیزی نیس کە بهترین کادویی کە میتونم بهت بدم خودمم...قبول داری دیگه؟ 💖"
];

// ============ افکت تایپ ============
const typed = document.getElementById('typed');
let msgIdx = 0, charIdx = 0;

function typeLoop() {
  const msg = MESSAGES[msgIdx];
  if (charIdx < msg.length) {
    typed.innerHTML = msg.substring(0, charIdx + 1) + '<span class="cursor"></span>';
    charIdx++;
    setTimeout(typeLoop, 55);
  } else {
    setTimeout(eraseLoop, 3000);
  }
}
function eraseLoop() {
  const msg = MESSAGES[msgIdx];
  if (charIdx > 0) {
    charIdx--;
    typed.innerHTML = msg.substring(0, charIdx) + '<span class="cursor"></span>';
    setTimeout(eraseLoop, 20);
  } else {
    msgIdx = (msgIdx + 1) % MESSAGES.length;
    setTimeout(typeLoop, 300);
  }
}
typeLoop();

// ============ ایموجی‌های شناور ============
const floaties = document.getElementById('floaties');
const EMOJIS = ['❤️', '💖', '💕', '🎈', '🎉', '✨', '🌟', '🎁', '🎂', '💝', '🍪'];

function spawnFloaty() {
  const el = document.createElement('div');
  el.className = 'floaty';
  el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  el.style.left = Math.random() * 100 + '%';
  el.style.fontSize = (Math.random() * 20 + 20) + 'px';
  const dur = Math.random() * 5 + 7;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = (Math.random() * 2) + 's';
  floaties.appendChild(el);
  setTimeout(() => el.remove(), (dur + 3) * 1000);
}
for (let i = 0; i < 8; i++) setTimeout(spawnFloaty, i * 400);
setInterval(spawnFloaty, 500);

// ============ کانفتی و آتیش‌بازی ============
window.addEventListener('load', () => {
  confetti({
    particleCount: 150,
    spread: 100,
    origin: { y: 0.6 },
    colors: ['#ff6ec7', '#ffd93d', '#6bcbff', '#a0ff6b', '#c78bff']
  });
  const end = Date.now() + 2500;
  (function frame() {
    confetti({
      particleCount: 4, angle: 60, spread: 55,
      origin: { x: 0 }, colors: ['#ff6ec7', '#ffd93d']
    });
    confetti({
      particleCount: 4, angle: 120, spread: 55,
      origin: { x: 1 }, colors: ['#6bcbff', '#c78bff']
    });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
});

setInterval(() => {
  confetti({
    particleCount: 50,
    spread: 360,
    startVelocity: 28,
    origin: { x: Math.random(), y: Math.random() * 0.5 },
    colors: ['#ff6ec7', '#ffd93d', '#6bcbff', '#a0ff6b', '#c78bff', '#ff3d81'],
    ticks: 120,
    gravity: 0.9,
  });
}, 1500);

function moreFireworks() {
  const end = Date.now() + 2500;
  (function frame() {
    confetti({
      particleCount: 6,
      spread: 360,
      startVelocity: 30,
      origin: { x: Math.random(), y: Math.random() * 0.6 },
      colors: ['#ff6ec7', '#ffd93d', '#6bcbff', '#a0ff6b', '#c78bff'],
      ticks: 150,
    });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

// ============ آرزوی جدید ============
let wishIdx = 0;
const wishEl = document.getElementById('wish');

function newWish() {
  wishEl.style.transform = 'scale(0.9)';
  wishEl.style.opacity = '0.5';
  setTimeout(() => {
    wishIdx = (wishIdx + 1) % WISHES.length;
    wishEl.textContent = WISHES[wishIdx];
    wishEl.style.transform = 'scale(1)';
    wishEl.style.opacity = '1';
  }, 200);
  confetti({
    particleCount: 40, spread: 70,
    origin: { y: 0.7 },
    colors: ['#ff6ec7', '#ffd93d', '#6bcbff', '#a0ff6b']
  });
}
</script>
</body>
</html>
